[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "swing-trading-ai-assistant"
version = "0.1.0"
description = "Deterministic market-data and research foundations for Nifty 50 swing trading"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "pyarrow>=25,<26",
    "python-dotenv>=1.1",
    "yfinance==1.6.0",
]

[project.optional-dependencies]
dev = [
    "hatchling>=1.26,<2",
    "psutil==7.2.2",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.0",
    "vulture>=2.14",
]

[project.scripts]
market-data = "swing_trading_ai_assistant.market_data.cli:main"
historical-census = "swing_trading_ai_assistant.historical_evaluation.cli:main"
evidence-readiness = "swing_trading_ai_assistant.historical_evaluation.prospective_cli:main"
market-regime-acquisition-decision = "swing_trading_ai_assistant.historical_evaluation.acquisition_decision_cli:main"
historical-validation-gate = "swing_trading_ai_assistant.entrypoints.historical_validation_gate:main"
capture-forward-adjusted-ohlcv = "swing_trading_ai_assistant.entrypoints.capture_forward_adjusted_ohlcv:main"
equity-data-download = "equity_data_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_data_downloader", "src/swing_trading_ai_assistant"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=equity_data_downloader --cov=swing_trading_ai_assistant --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=87 -n auto --dist=worksteal"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "private_source: requires owner-private retained source evidence unavailable on hosted CI",
]

[tool.coverage.run]
branch = true
source = ["equity_data_downloader", "swing_trading_ai_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 87

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".codex"]

[tool.ruff.lint]
select = [
    "E4", # pycodestyle errors
    "E7", # pycodestyle errors
    "E9", # pycodestyle errors
    "F", # Pyflakes
    "I", # import order
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "PERF", # Perflint
    "C90", # McCabe complexity
    "PLC", # Pylint convention
    "PLE", # Pylint errors
    "PLW", # Pylint warnings
    "S", # flake8-bandit security checks
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
