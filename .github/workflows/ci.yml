name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

env:
  SWING_CONTAINER_RUNTIME: docker

jobs:
  reject-untrusted-main:
    name: Reject unauthorized main actor
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'krunaldodiya/SwingTradingAIAssistant' &&
      github.actor != 'krunaldodiya'
    permissions: {}
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject without checking out untrusted source
        shell: bash
        run: |
          echo 'Main admission rejected: this actor is outside the approved owner-only runner policy.' >&2
          exit 1

  quality:
    name: Quality and build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.repository == 'krunaldodiya/SwingTradingAIAssistant' &&
      github.actor == 'krunaldodiya' &&
      github.event.pull_request.user.login == 'krunaldodiya' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
      queue: single
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the sealed change
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
            echo "Comparison base is unavailable; failing closed to the full gate."
            echo "full_gate=true" >> "$GITHUB_OUTPUT"
            echo "lifecycle_gate=false" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --no-renames --name-only "$base" "$GITHUB_SHA")"
            full_gate=false
            lifecycle_gate=false
            outside_lifecycle=""
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                *.md)
                  ;;
                tests/test_sprint3_release_readiness.py)
                  lifecycle_gate=true
                  ;;
                *)
                  full_gate=true
                  outside_lifecycle+="${outside_lifecycle:+$'\n'}$path"
                  ;;
              esac
            done <<< "$changed"
            if [[ "$full_gate" == "true" ]]; then
              echo "full_gate=true" >> "$GITHUB_OUTPUT"
              echo "lifecycle_gate=false" >> "$GITHUB_OUTPUT"
              printf 'Full gate required for:\n%s\n' "$outside_lifecycle"
            elif [[ "$lifecycle_gate" == "true" ]]; then
              echo "full_gate=false" >> "$GITHUB_OUTPUT"
              echo "lifecycle_gate=true" >> "$GITHUB_OUTPUT"
              echo "Lifecycle documentation change: using the focused lifecycle gate."
            else
              echo "full_gate=false" >> "$GITHUB_OUTPUT"
              echo "lifecycle_gate=false" >> "$GITHUB_OUTPUT"
              echo "Markdown-only change: using the lightweight required gate."
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lightweight Markdown gate
        if: >-
          steps.changes.outputs.full_gate != 'true' &&
          steps.changes.outputs.lifecycle_gate != 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Set up uv and Python
        if: >-
          steps.changes.outputs.full_gate == 'true' ||
          steps.changes.outputs.lifecycle_gate == 'true'
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: false
          version: "0.9.24"
          python-version: "3.11"
          checksum: "fb13ad85106da6b21dd16613afca910994446fe94a78ee0b5bed9c75cd066078"

      - name: Install locked development dependencies
        if: >-
          steps.changes.outputs.full_gate == 'true' ||
          steps.changes.outputs.lifecycle_gate == 'true'
        run: uv sync --extra dev --frozen

      - name: Run focused lifecycle documentation gate
        if: steps.changes.outputs.lifecycle_gate == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
        run: >-
          git diff --check "$BASE_SHA" "$GITHUB_SHA" &&
          uv run --no-sync --extra dev ruff format --check tests/test_sprint3_release_readiness.py &&
          uv run --no-sync --extra dev ruff check tests/test_sprint3_release_readiness.py &&
          uv run --no-sync --extra dev pytest tests/test_sprint3_release_readiness.py --no-cov

      - name: Run authoritative quality gate
        if: steps.changes.outputs.full_gate == 'true'
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: >-
          uv run --no-sync --extra dev ruff format --check . &&
          uv run --no-sync --extra dev ruff check . &&
          uv run --no-sync --extra dev pyright &&
          uv run --no-sync --extra dev vulture src --min-confidence 80 &&
          uv run --no-sync --extra dev pytest -m "not private_source" -q --durations=20 --durations-min=1

      - name: Build distribution
        if: steps.changes.outputs.full_gate == 'true'
        run: uv build --no-build-isolation --python .venv/bin/python

      - name: Verify Linux wheel and OCI distribution
        if: steps.changes.outputs.full_gate == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run --no-sync --extra dev python scripts/verify_linux_distribution.py
          --wheel dist/swing_trading_ai_assistant-*.whl
          --prior-commit "$PR_BASE_SHA"
          --receipt "$RUNNER_TEMP/linux-distribution-receipt.json"

      - name: Record Linux distribution receipt in GitHub
        if: steps.changes.outputs.full_gate == 'true'
        run: |
          set -euo pipefail
          jq -c . "$RUNNER_TEMP/linux-distribution-receipt.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Issue exact-tree CI admission
        env:
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: >-
          python3 .github/scripts/ci_admission.py issue
          --output "$RUNNER_TEMP/ci-admission.json" --annotation

      - name: Record exact-tree CI admission in GitHub
        run: |
          set -euo pipefail
          jq -c . "$RUNNER_TEMP/ci-admission.json" | tee -a "$GITHUB_STEP_SUMMARY"


  main-backstop:
    name: Main admission backstop
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'krunaldodiya/SwingTradingAIAssistant' &&
      github.actor == 'krunaldodiya'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact prior CI admission
        id: admission
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_ADMISSION_TRANSPORT: check-annotation
        run: >-
          python3 .github/scripts/ci_admission.py verify
          --output "$GITHUB_OUTPUT"

      - name: Run admitted merge integrity gate
        if: >-
          steps.admission.outcome == 'success' &&
          steps.admission.outputs.admitted == 'true'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"

      - name: Explain full-gate fallback
        if: >-
          steps.admission.outcome != 'success' ||
          steps.admission.outputs.admitted != 'true'
        env:
          ADMISSION_REASON: ${{ steps.admission.outputs.reason }}
        run: >-
          printf 'Exact prior admission unavailable; running full gate.\nReason: %s\n'
          "$ADMISSION_REASON"

      - name: Set up uv and Python for fallback
        if: >-
          steps.admission.outcome != 'success' ||
          steps.admission.outputs.admitted != 'true'
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: false
          version: "0.9.24"
          python-version: "3.11"
          checksum: "fb13ad85106da6b21dd16613afca910994446fe94a78ee0b5bed9c75cd066078"

      - name: Install locked development dependencies for fallback
        if: >-
          steps.admission.outcome != 'success' ||
          steps.admission.outputs.admitted != 'true'
        run: uv sync --extra dev --frozen

      - name: Run authoritative fallback gate
        if: >-
          steps.admission.outcome != 'success' ||
          steps.admission.outputs.admitted != 'true'
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: >-
          uv run --no-sync --extra dev ruff format --check . &&
          uv run --no-sync --extra dev ruff check . &&
          uv run --no-sync --extra dev pyright &&
          uv run --no-sync --extra dev vulture src --min-confidence 80 &&
          uv run --no-sync --extra dev pytest -m "not private_source" -q --durations=20 --durations-min=1

      - name: Build fallback distribution
        if: >-
          steps.admission.outcome != 'success' ||
          steps.admission.outputs.admitted != 'true'
        run: uv build --no-build-isolation --python .venv/bin/python
