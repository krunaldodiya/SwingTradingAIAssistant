name: Windows distribution conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-distribution
  cancel-in-progress: false

jobs:
  conformance:
    # No pull_request, push, repository_dispatch, or user-supplied source refs.
    if: github.ref == 'refs/heads/main' && github.repository == 'krunaldodiya/SwingTradingAIAssistant'
    runs-on: [self-hosted, Windows, X64, swing-windows-conformance]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify WSL installed wheel and published Docker Desktop digest
        shell: powershell
        run: ./scripts/verify_windows_distribution.ps1
      - name: Retain host, artifact identities and conformance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-distribution-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/windows-distribution/
          if-no-files-found: error
          retention-days: 90
