name: Windows distribution conformance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-distribution
  cancel-in-progress: false

jobs:
  conformance:
    # WSL2 + Docker Desktop remains a separate qualification, never a Linux pass.
    if: github.ref == 'refs/heads/main' && github.repository == 'krunaldodiya/SwingTradingAIAssistant' && github.actor == 'krunaldodiya'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report unsupported hosted Windows qualification
        run: |
          echo '::error::Windows qualification is blocked: the required WSL2 and Docker Desktop environment is not established on standard hosted runners. Local CI fallback is prohibited.'
          exit 1
